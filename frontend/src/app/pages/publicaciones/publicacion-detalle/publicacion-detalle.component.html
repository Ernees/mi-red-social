@if (publicacion) {
<div class="detalle-publicacion">
  <button (click)="volverAtras()">Volver</button>

  <h2>{{ publicacion.titulo }}</h2>
  <p>{{ publicacion.descripcion }}</p>

  @if (publicacion.urlImagen) {
  <img
    [src]="'http://localhost:3000/imgpublicaciones/' + publicacion.urlImagen"
    alt="Imagen"
    class="img-fluid"
  />
  } @if (mostrarBotonBaja) {
  <button class="btn btn-danger" (click)="darDeBaja()">Dar de baja</button>
  }

  <app-comentarios [publicacionId]="publicacion._id"></app-comentarios>
</div>
}
