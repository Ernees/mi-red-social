@if (publicacion) {
<div class="publicacion-card">
  <h5 class="card-title">{{ publicacion.titulo }}</h5>
  <p class="card-text">{{ publicacion.descripcion }}</p>

  <div class="d-flex justify-content-between align-items-center">
    <div class="image-wrapper">
      @if (publicacion.urlImagen) {
      <img
        [src]="
          'http://localhost:3000/imgpublicaciones/' + publicacion.urlImagen
        "
        class="card-img-top"
        alt="Imagen de la publicación"
      />
      }
    </div>

    <div class="botones">
      @if (mostrarBotonesLike) {
      <button class="btn btn-outline-primary btn-sm" (click)="toggleLike()">
        {{ dioLike() ? "Quitar Like ❤️" : "Dar Like 🤍" }}
      </button>
      } @if (mostrarBotonBaja) {
      <button class="btn btn-danger btn-sm" (click)="eliminar()">
        Dar de baja
      </button>
      }
    </div>

    <span>{{ publicacion.likes.length }} Me gusta</span>
  </div>

  @if (publicacion._id) {
  <div class="botones">
    <button (click)="verEnGrande()">Ver en grande</button>
  </div>
  }
</div>
}
