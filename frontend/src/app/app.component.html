<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenida</title>
    <link rel="stylesheet" href="app.component.css" />
  </head>
  <body>
    <div class="container">
      @if (cargando) {
      <app-spinner />
      } @else {
      <nav class="navbar">
        <div class="navbar-logo">🧠 SocialMind</div>
        <div class="navbar-links">
          @if (!authService.estaLogueado()) {
          <a routerLink="/bienvenida" routerLinkActive="active-link"
            >Bienvenida</a
          >
          <a routerLink="/registro" routerLinkActive="active-link">Registro</a>
          <a routerLink="/login" routerLinkActive="active-link">Login</a>
          } @else {
          <div class="dropdown">
            <a class="dropbtn">Publicaciones ▼</a>
            <div class="dropdown-content">
              <a routerLink="/publicaciones">Ver publicaciones</a>
              <a routerLink="/publicaciones/crear">Crear publicación</a>
            </div>
          </div>
          <a routerLink="/mi-perfil" routerLinkActive="active-link"
            >Mi Perfil</a
          >
          <button (click)="authService.cerrarSesion()">Cerrar sesión</button>
          }
        </div>
      </nav>

      <router-outlet />
      }
    </div>
  </body>
</html>
